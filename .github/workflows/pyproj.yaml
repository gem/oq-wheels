---
name: pyproj wheels  for x86_64 and arm64
on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "tmate debugging enabled"
        required: false
        default: false
#  pull_request:
env:
  WHEEL_SDIR: wheelhouse
jobs:
  build_pyproj_OSX_arm64:
    name: pyproj ${{ matrix.python }} ${{ matrix.os-name }} ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python: ["3.12", "3.13", "3.14"]
        platform: ["arm64"]
    env:
      REPO_DIR: pyproj
      BUILD_COMMIT: 3.8.0+gem261118
      WHEEL_SDIR: wheelhouse
      PLAT: "${{ matrix.platform }}"
      MB_PYTHON_VERSION: "${{ matrix.python }}"
      BUILD_DEPENDS: "wheel numpy==2.4.6 build pip==25.2 Cython==3.1.4 setuptools==80.9.0 tomli==2.2.1 versioneer[toml]==0.28"
      TRAVIS_OS_NAME: ${{ matrix.os-name }}
    steps:
      - uses: actions/checkout@v6
      - name: get code of pyproj
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          bash -x .github/workflows/build.sh
      - name: Build Wheel of pyproj
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          bash -x .github/workflows/wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: "wheels_pyproj_${{ matrix.python }}_${{ matrix.platform }}"
          path: wheelhouse/pyproj*whl

  build_pyproj_Linux_x86_64:
    name: pyproj ${{ matrix.python }} ${{ matrix.os-name }} ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04"]
        python: ["3.12", "3.13", "3.14"]
        platform: ["x86_64"]
    env:
      REPO_DIR: pyproj
      BUILD_COMMIT: 3.8.0+gem261118
      WHEEL_SDIR: wheelhouse
      PLAT: "${{ matrix.platform }}"
      MB_PYTHON_VERSION: "${{ matrix.python }}"
      MB_ML_VER: "_2_28"
      BUILD_DEPENDS: "wheel numpy==2.4.6 build pip==25.2 Cython==3.1.4 setuptools==80.9.0 tomli==2.2.1 versioneer[toml]==0.28"
      TEST_DEPENDS: "cython"
      TRAVIS_OS_NAME: ${{ matrix.os-name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: get code of pyproj
        run: |
          echo $PATH
          bash -x .github/workflows/build.sh
      - name: Build Wheel of pyproj
        run: |
          echo $PATH
          sudo apt install python3-virtualenv
          bash -x .github/workflows/wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: "wheels_pyproj_${{ matrix.python }}_${{ matrix.platform }}"
          path: wheelhouse/pyproj*whl
